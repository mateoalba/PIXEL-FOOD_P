name: 🚀 Deploy Pixel-Food backend API to VPS

on:
  push:
    branches: [Modulos]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Copy project to VPS
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: root
        key: ${{ secrets.VPS_KEY }}
        source: "."
        target: "/opt/PIXEL-FOOD_P"

    - name: Run deploy commands on VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: root
        key: ${{ secrets.VPS_KEY }}
        script: |
          set -e
          cd /opt/PIXEL-FOOD_P/backend-pixel-food

          # Limpiar procesos y carpetas viejas
          sudo lsof -t -i:3000 | xargs -r sudo kill -9 || true
          rm -rf dist frontend-pixel-food

          # Inyectar variables de entorno
          printf "%s" "${{ secrets.ENV_FILE }}" > .env

          # Instalar dependencias
          npm install

          # --- FIX PARA EL ERROR TS5098 ---
          # Eliminamos la línea que causa conflicto en el tsconfig antes del build
          sed -i '/"resolvePackageJsonExports": true/d' tsconfig.build.json || true

          # Construir el proyecto
          npm run build

          # Desplegar con la ruta confirmada en tu terminal (dist/src/main.js)
          pm2 delete Pixel-Food-api || true
          pm2 start dist/src/main.js --name Pixel-Food-api
          pm2 save